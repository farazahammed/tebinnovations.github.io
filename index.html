<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FRZ GENERATIONS • Maintenance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #020617;
      color: #f9fafb;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
    }

    .box {
      max-width: 480px;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 2rem;
      background: radial-gradient(circle at top, #0f172a, #020617);
    }

    h1 {
      letter-spacing: 0.25em;
      font-size: 1.1rem;
      color: #fef3c7;
      margin-bottom: 0.5rem;
    }

    .status {
      color: #f97316;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    p {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #e5e7eb;
    }

    footer {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>FRZ GENERATIONS</h1>
    <div class="status">Server Down / Maintenance Mode</div>

    <p>
      The FRZ GENERATIONS server is currently unavailable or under maintenance.<br><br>
      Please wait for some time — we’ll update it shortly.
    </p>

    <footer>
      © 2026 FRZ GENERATIONS
    </footer>
  </div>
</body>
</html>
